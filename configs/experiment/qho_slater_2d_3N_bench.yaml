# @package _global_
# QUEUE.md P2 — Slater-determinant baseline, N=3 arm. Mirrors
# qho_fermisets_2d_3N_bench.yaml exactly (same N, hyperparams, budget) so the
# comparison isolates the ansatz choice: does antisymmetry-by-construction
# (SlaterNN, jnp.linalg.slogdet, no signature encoder, no L_z projection) avoid the
# holomorphic-trap plateau (E=6.0) that plain FermiSets needs L_z projection to escape?
# Exact GS E = 5.0 (closed shell, non-degenerate). Always trains FROM SCRATCH.
seed: 42
use_wnb: False

system:
  N: 3
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_slater_nn
  hidden_units: 64
  pretrained_path: null

trainer:
  vmc_iters: 1500
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
