# @package _global_
# PAIR-FEATURE variant of the canonical benchmark (RESEARCH_LOG 2026-07-15, Phase 2).
# Isotropic trap, from scratch, NO projection, NO pretraining — the exact setting where the
# plain ansatz has failed to 6.0 in all 746 historical runs. Tests whether the pair stream
# (log(r^2+eps) et al. sum-pooled over pairs) makes the triangle-area GS reachable directly.
# Exact GS E = 5.0.
seed: 42
use_wnb: False

system:
  N: 3
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 0        # deliberately OFF — the architecture must do it alone
  pair_hidden: 32

trainer:
  vmc_iters: 800
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
