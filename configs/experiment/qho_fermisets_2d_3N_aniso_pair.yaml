# @package _global_
# PAIR-FEATURE variant of the no-symmetry benchmark (RESEARCH_LOG 2026-07-15, Phase 2).
# Anisotropic trap omega_y=1.5, from scratch — plain ansatz converges to the first excited
# state det{1,x,x^2} at E=6.75 (fidelity 0.9989). Exact GS E = 6.25.
seed: 42
use_wnb: False

system:
  N: 3
  dim: 2
  potential: qho_aniso
  omega_y: 1.5

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 0          # MUST stay 0: L_z not conserved here
  pair_hidden: 32

trainer:
  vmc_iters: 800
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
