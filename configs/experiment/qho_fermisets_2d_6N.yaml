# @package _global_
seed: 42
system:
  N: 4
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units : 42
  #hydra uses null for "None"
  pretrained_path: null
  out_units: 15


trainer:
  vmc_iters: 1000
  lr: 0.05
  n_samples: 10240
  diag_shift: 0.05 # imroves stability but slows down convergence
  validation: true
  optmizer: momentum

sampler: 
  sigma: 0.1
  n_chains: 1024
  sweep_size: 32 
