# @package _global_
# CONTINUATION of qho_fermisets_2d_6N_lz_k4.yaml (RESEARCH_LOG 2026-07-18/19): the
# original run was killed on request at iter 353/800 (energy climbing 20.2->20.7,
# sigma^2 falling 7.9->5.0, inconclusive). Resumes from that run's checkpoint
# (step_350) for a fresh 500-iter budget (cumulative ~850, past the original 800
# target) to give the thin margin=1 case a fair chance to reach 14.0.
seed: 42
use_wnb: False

system:
  N: 6
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: /home/ilya/FermiNQS/outputs/2026-07-18/21-48-29/checkpoints/step_350.mpack
  lz_proj_K: 4

trainer:
  vmc_iters: 500
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
