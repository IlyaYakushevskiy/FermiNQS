# @package _global_
# INTERACTING DOT, ARM 1 — from scratch, plain ansatz, no projection, no pretraining
# (RESEARCH_LOG 2026-07-15). N=3 spinless fermions, trap + Gaussian repulsion
# lam=2, s=1. Exact GS from ED (tools/ed_dot.py, shells<=7, converged ~1e-4):
#   E_GS = 6.21066  (parity block (1,1), gap to first excited 0.81 -> non-degenerate)
# The falsification arm: with interactions on, eta*symmetric is NOT an eigenstate of H,
# and neither is det{1,x,x^2}-type. Does from-scratch VMC now find the GS, or does a
# lazy-sign-structure basin still capture it?
seed: 42
use_wnb: False

system:
  N: 3
  dim: 2
  potential: dot_gauss
  int_strength: 2.0
  int_range: 1.0
  e_ref: 6.21066     # ED reference — regenerate with: python tools/ed_dot.py --N 3 --lam 2.0 --s 1.0 --shells 7

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 0
  pair_hidden: 0     # plain ansatz — matches the historical failure conditions

trainer:
  vmc_iters: 800
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
