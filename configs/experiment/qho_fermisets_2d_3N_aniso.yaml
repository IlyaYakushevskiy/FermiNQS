# @package _global_
# NO-SYMMETRY BENCHMARK — anisotropic trap v = (x^2 + omega_y^2 y^2)/2 (RESEARCH_LOG 2026-07-15).
# Rotational symmetry is fully broken ([H, L_z] != 0): the L_z projection is unavailable AND
# would be wrong — lz_proj_K must stay 0 (main.py enforces this).
# Falsification test of the holomorphic-trap hypothesis: eta * symmetric is NOT an eigenstate
# here, so from-scratch VMC should be able to slide off it. Outcome A: E -> 6.25 (trap was a
# QHO artifact). Outcome B: stall above 6.25 near det{1,z,z^2} x squeezed envelope (soft basin).
# Exact GS (N=3, omega_y=1.5): levels 1.25 + 2.25 + 2.75 = 6.25, Fermi gap 0.5, non-degenerate.
seed: 42
use_wnb: False

system:
  N: 3
  dim: 2
  potential: qho_aniso
  omega_y: 1.5     # NOT 2.0 — integer ratios degenerate the Fermi level (guard raises)

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null   # from scratch — this is the whole point of the test
  lz_proj_K: 0            # MUST stay 0: L_z is not conserved in the anisotropic trap

trainer:
  vmc_iters: 800
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
