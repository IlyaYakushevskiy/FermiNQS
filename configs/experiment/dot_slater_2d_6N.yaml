# @package _global_
# QUEUE.md P2 — Slater-determinant baseline, N=6 interacting-dot arm. Mirrors
# dot_gauss_2d_6N_lz.yaml's system/hyperparams (e_ref, budget) minus lz_proj_K and the
# FermiSets warm-start (this ansatz always trains from scratch -- no cross-system
# checkpoint to inherit from). ED reference E=19.0038 (shells<=6, block (0,0), L_z=0).
seed: 42
use_wnb: False

system:
  N: 6
  dim: 2
  potential: dot_gauss
  int_strength: 2.0
  int_range: 1.0
  e_ref: 19.0038

ansatz:
  model: fermi_slater_nn
  hidden_units: 64
  pretrained_path: null

trainer:
  vmc_iters: 1000
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
