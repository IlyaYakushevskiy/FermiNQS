# @package _global_
# K-vs-N MARGIN ABLATION, arm 1 of 2 (QUEUE.md P0, RESEARCH_LOG 2026-07-16 lz_margin
# analysis). Identical to qho_fermisets_2d_6N_lz.yaml (the validated K=6 run) except
# lz_proj_K=3. tools/lz_margin.py: margin(N=6, K=3) = 0 -- the projection sector still
# contains L_z=15 (the holomorphic trap itself, lz0=N(N-1)/2=15, 15%3==0), i.e. K=3
# does NOT exclude the trap at all. PREDICTED: total failure, reproduces the E=21 trap
# exactly like the unprojected N=6 runs. This arm exists to empirically confirm the
# margin=0 prediction, not because anyone expects it to work.
seed: 42
use_wnb: False

system:
  N: 6
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 3

trainer:
  vmc_iters: 500
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
