# @package _global_
# K-vs-N MARGIN ABLATION, arm 3 (widening the sweep beyond K=3,4,6, RESEARCH_LOG
# 2026-07-16 lz_margin analysis, requested 2026-07-26 for the thesis figure). Identical
# to qho_fermisets_2d_6N_lz.yaml (the validated K=6 run) except lz_proj_K=12.
# tools/lz_margin.py: margin(N=6, K=12) = 9 -- three times K=6's margin of 3, the
# widest buffer tested. PREDICTION (consistent with the K=3/4/6 result): margin does
# not matter here, because the plateau at E~16-17 is a same-sector obstruction
# (excited states at L_z=0), not the trap itself, so K=12 should stall in the same
# band as the others rather than reach 14.0. 900 iterations to match the cumulative
# budget of the K=3/K=4/K=6 runs it will be plotted against.
# chunk_size=1024 OOM'd at step 0 (7.87GiB alloc); halving to 512 OOM'd again at an
# almost identical ~5.7GiB rematerialization floor (6.56GiB alloc) -- chunk_size only
# buys a small fraction of the difference, so the dominant cost is NOT the chunked
# local-energy pass but the minSR/NTK kernel matrix, which is O(n_samples^2) and is
# NOT reduced by chunk_size. Cutting n_samples 4096->2048 (quarters the kernel matrix)
# alongside chunk_size 512->256 (2026-07-26).
seed: 42
use_wnb: False

system:
  N: 6
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 12

trainer:
  vmc_iters: 900
  lr: 0.01
  n_samples: 2048
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 256
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
