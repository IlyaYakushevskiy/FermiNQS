# @package _global_
seed: 42
system:
  N: 5
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units : 32
  #hydra uses null for "None"
  pretrained_path: null
  out_units: 10


trainer:
  vmc_iters: 1000
  lr: 0.05
  n_samples: 8192
  diag_shift: 0.02 # imroves stability but slows down convergence
  validation: true
  optmizer: momentum
  chunk_size: 1024

sampler: 
  sigma: 0.1
  n_chains: 1024
  sweep_size: 32 
