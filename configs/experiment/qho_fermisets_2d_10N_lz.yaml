# @package _global_
# SCALING TEST — N=10, next closed shell above N=6 (shells 0,1,2,3 filled: 1+2+3+4=10).
# Exact GS E = 30.0 (1*1 + 2*2 + 3*3 + 4*4), non-degenerate. Vandermonde trap
# L_z = N(N-1)/2 = 45. Purpose (user request 2026-07-19): N=6 gave K=3/4/6 margin=0/1/3
# respectively and ALL THREE plateaued at the same 17.2-17.5 energy in ~1000 iters --
# margin made no visible difference there, but at N=6 every tested K was comparable to
# N itself (K=6 == N), so no computational win was actually being demonstrated even in
# principle. N=10 with K=6 is the smallest closed shell where K=6 still gives a healthy
# margin=3 (`tools/lz_margin.py --N 10 --K 6`) while being GENUINELY K < N. Goal: show
# Vandermonde/FermiSets is in-principle convergeable at an N where the O(K*N^2) claim
# would actually pay off if it converges, before revisiting the interacting dot.
# DELIBERATELY identical architecture/hyperparams to N=3/N=6 (hidden 64, out 10, K=6,
# momentum lr 0.01, 4096 samples) -- nothing tuned, same question as the N=6 run: does
# fixed capacity + fixed K deliver when N grows further. Iters bumped 500->1500 since
# N=6 needed more than 1000 and didn't fully land.
seed: 42
use_wnb: False

system:
  N: 10
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 6

trainer:
  vmc_iters: 1500
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
