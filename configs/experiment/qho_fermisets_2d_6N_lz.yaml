# @package _global_
# SCALING TEST — N=6, next closed shell (RESEARCH_LOG 2026-07-15). Exact GS E = 14.0
# (shells 0,1,2 filled), non-degenerate, gap 1. Historical unprojected N=6 runs all
# landed on the trap det{1,z,...,z^5} at E = 21 (L_z = 15). K=6 keeps the whole lazy
# family unrepresentable (lowest survivor E >= 24; leakage |L_z| >= 6 at E >= 20).
# DELIBERATELY identical architecture/hyperparams to the N=3 benchmark (hidden 64,
# out 10, K=6, momentum lr 0.01, 4096 samples): the question is what FIXED capacity
# delivers when N doubles, so nothing is tuned.
seed: 42
use_wnb: False

system:
  N: 6
  dim: 2
  potential: qho_no_inter

ansatz:
  model: fermi_sets
  hidden_units: 64
  out_units: 10
  pretrained_path: null
  lz_proj_K: 6

trainer:
  vmc_iters: 500
  lr: 0.01
  n_samples: 4096
  diag_shift: 0.05
  validation: true
  optimizer: momentum
  momentum_beta: 0.9
  chunk_size: 1024
  lr_decay_rate: 0.95
  lr_decay_steps: 100
  pinv_rtol: 1e-12
  pinv_atol: 1e-14

sampler:
  sigma: 0.1
  n_chains: 512
  sweep_size: 32
